name: Docker CI

on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t adeeldockerhub/github-img:latest .

      - name: Push Docker Image
        run: |
          docker push adeeldockerhub/github-img:latest
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E65982B193414DF3BB8CCD25E7442CDF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_354D1830CC384CCA8191E2DE3BB93CF0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D10DB7402FD4C99A66C3BAE6695BD48 }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: adeel-github-app-2026
          images: docker.io/adeeldockerhub/github-img:latest
